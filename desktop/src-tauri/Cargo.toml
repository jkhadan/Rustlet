[package]
name = "rustlet-desktop"
description = "Rustlets Desktop: the Rust side of the Tauri app (commands, streams and terminal sessions over rustlet-client)."
version.workspace = true
edition.workspace = true
rust-version = "1.90"
license.workspace = true
authors.workspace = true
publish = false

[lints]
workspace = true

[lib]
name = "rustlet_desktop"

[build-dependencies]
tauri-build = { version = "2.7.1", features = [] }

[dependencies]
rustlet-client.workspace = true
rustlet-spec.workspace = true
tauri = { version = "2.12.1", features = [] }
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
futures.workspace = true
thiserror.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true

[dev-dependencies]
# Paused time, for the batching tests.
tokio = { workspace = true, features = ["test-util"] }
