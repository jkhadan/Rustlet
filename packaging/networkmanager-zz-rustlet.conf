# Installed as /etc/NetworkManager/conf.d/zz-rustlet.conf
# Tell NetworkManager to leave the Rustlets bridges (rustlet0 for the default
# network, rlb<id> for networks you create) and veth devices (rlv<id>) alone;
# otherwise it may try to "manage" them (DHCP, IPv6 autoconf) as they appear.
#
# conf.d files are read in alphabetical order, each overriding the ones
# before: Ubuntu's ubuntu-system-adjustments.conf sets unmanaged-devices=none,
# so this one must come later ("zz-") and append (+=) to what is set before.
[keyfile]
unmanaged-devices+=interface-name:rustlet*;interface-name:rlb*;interface-name:rlv*
